[package]
name = "kl-gate"
version = "0.6.0"
edition = "2021"
description = "Hook gates for the kl-skills Claude Code plugin"
license = "MIT"

[dependencies]
# Hook payloads arrive as JSON on stdin. Hand-rolling a parser for "just one
# field" is how you end up mis-reading a path that contains a quote or a brace,
# and a gate that mis-reads its input either nags about the wrong file or stays
# silent on the right one.
serde_json = "1"
