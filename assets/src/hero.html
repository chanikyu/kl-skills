<!doctype html>
<html lang="en" data-radius="sharp" data-type="software">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>kl-skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/system.css">
<link rel="stylesheet" href="assets/icons/icon.css">
<!-- <html lang="en" data-radius="sharp">; keep this <style> after the links: layout.css resets --ly-scale -->
<style>
:root {
  --p-bg: #ffffff; --p-surface: #f4f4f4; --p-ink: #111111; --p-muted: #6b6b6b;
  --p-accent: #1a4be0; --p-accent-ink: #ffffff; --p-action: #1a4be0; --p-action-ink: #ffffff;
  --p-inv-bg: #111111; --p-inv-surface: #1e1e1e; --p-inv-ink: #ffffff; --p-inv-muted: #9a9a9a;
  --p-inv-accent: #ffffff; --p-inv-accent-ink: #111111; --p-inv-action: #ffffff; --p-inv-action-ink: #111111;
  --font-display: "Instrument Sans", system-ui, sans-serif;
  --font-text: "Instrument Sans", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --display-weight: 500;
  --display-tracking: -0.028em;
  --display-tracking-xl: -0.036em;
  --display-stretch: 96%;
  --ly-scale: 1.04;
}
</style>
<link rel="stylesheet" href="assets/diagrams/diagram.css">

<style>
  html, body { margin: 0; background: var(--p-bg); }
  body { width: 1200px; height: 360px; overflow: hidden; font-family: var(--font-text); color: var(--p-ink); }
  
  .hero { box-sizing: border-box; height: 100%; padding: 56px 64px; display: grid;
          grid-template-columns: 1fr 560px; gap: 56px; align-items: center;
          border: 1px solid #e4e4e4; }
  .eyebrow { font-family: var(--font-mono); font-size: 15px; color: var(--p-muted); margin: 0 0 18px; }
  h1 { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 104px; line-height: .95;
       letter-spacing: var(--display-tracking-xl); margin: 0 0 22px; }
  .lede { font-size: 24px; line-height: 1.35; color: var(--p-muted); margin: 0; max-width: 470px; }
  .term { background: var(--p-surface); border: 1px solid #e4e4e4; font-family: var(--font-mono); font-size: 15px;
          line-height: 1.75; padding: 22px 26px; }
  .term .bar { color: var(--p-muted); font-size: 13px; margin-bottom: 14px; display: flex; justify-content: space-between; }
  .term .p { color: var(--p-muted); }
  .term .ok { color: var(--p-accent); }
  .term .gap { height: 14px; }

</style>
</head>
<body>
<div class="hero">
  <div>
    <p class="eyebrow">Claude Code plugin</p>
    <h1>kl-skills</h1>
    <p class="lede">Skills and hook gates for Claude Code, installed together.</p>
  </div>
  <div class="term" aria-label="Installing kl-skills in Claude Code">
    <div class="bar"><span>claude</span><span>~/project</span></div>
    <div><span class="p">&gt;</span> /plugin marketplace add chanikyu/kl-skills</div>
    <div><span class="p">&gt;</span> /plugin install kl-skills@kl-skills</div>
    <div class="gap"></div>
    <div class="p">restart the session</div>
    <div class="ok">KL-SKILLS GATES v0.20.2 — loaded, 9 rules enforced</div>
  </div>
</div>
<script type="module" src="assets/diagrams/mount.js"></script>
</body>
</html>
